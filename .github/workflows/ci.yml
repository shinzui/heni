name: Cabal
on: [push, pull_request]
jobs:
  release-validation:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ['9.12.4']
        bounds: [lower, newest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.16.1.0'
      - run: cabal update
      - name: Schema validation environment
        run: |
          python3 -m venv "$RUNNER_TEMP/heni-schema"
          "$RUNNER_TEMP/heni-schema/bin/pip" install jsonschema==4.26.0
      - name: Core, optional reporters, patches and standalone archives
        env:
          HENI_CI_WERROR: '1'
          TMPDIR: ${{ runner.temp }}
          HENI_SCHEMA_PYTHON: ${{ runner.temp }}/heni-schema/bin/python
        run: sh scripts/check-sdist.sh --bounds '${{ matrix.bounds }}' --output dist-release
      - name: Retain archive checks and solver evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.ghc }}-${{ matrix.bounds }}
          path: |
            dist-release/
